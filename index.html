<!DOCTYPE html>
<html>
<head>
    <title>Crowdfunding DApp</title>
</head>
<body>

<h2>Connect Wallet</h2>
<button onclick="connectWallet()">Connect</button>

<h2>Create Campaign</h2>
<input id="goal" placeholder="Goal in wei">
<input id="duration" placeholder="Duration (seconds)">
<button onclick="createCampaign()">Create</button>

<h2>Contribute</h2>
<input id="campaignId" placeholder="Campaign ID">
<input id="amount" placeholder="Amount in wei">
<button onclick="contribute()">Send</button>

<script src="https://cdn.jsdelivr.net/npm/web3@1.7.0/dist/web3.min.js"></script>
<script src="app.js"></script>

</body>
</html>
